name: Povo
options:
  bundleIdPrefix: jp.povo.manager
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.0'
  generateEmptyDirectories: true
packages:
  PovoKit:
    path: Packages/PovoKit
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ''
    DEVELOPMENT_TEAM: ''
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: targeted
    POVO_APP_GROUP: group.jp.povo.manager.ios
    POVO_UPDATE_REPO: rticks/povo-ios
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) DEBUG'
targets:
  Povo:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ['Info.plist', '*.entitlements']
      - path: Shared
      - path: Generated/povo_core.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.povo.manager.ios
        PRODUCT_NAME: Povo
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Povo.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': App/Simulator.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: '$(inherited) -lc++ -lresolv'
    dependencies:
      - package: PovoKit
      - framework: build/PovoCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - target: PovoWidgets
        embed: true
  PovoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ['Info.plist', '*.entitlements']
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.povo.manager.ios.widgets
        PRODUCT_NAME: PovoWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/PovoWidgets.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': Widgets/Simulator.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: PovoKit
  PovoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.povo.manager.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Povo
      - package: PovoKit
  PovoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.povo.manager.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Povo
    dependencies:
      - target: Povo
schemes:
  Povo:
    build:
      targets:
        Povo: all
        PovoWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PovoTests
        - PovoUITests
      gatherCoverageData: true
    archive:
      config: Release
